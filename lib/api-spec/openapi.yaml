openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AutoCare API — vehicle owners book services, service centers fulfill them.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: vehicles
  - name: serviceCenters
  - name: mechanics
  - name: bookings
  - name: invoices
  - name: dashboard
  - name: catalog
  - name: vendors
  - name: parts
  - name: orders
  - name: rentals
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageError'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageError'
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema: { type: string, format: binary }
        '404':
          description: File not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageError' }
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema: { type: string, format: binary }
        '404':
          description: Object not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageError' }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /vehicles:
    get:
      operationId: listVehicles
      tags: [vehicles]
      summary: List all vehicles for the current owner
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Vehicle" }
    post:
      operationId: createVehicle
      tags: [vehicles]
      summary: Register a new vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateVehicleInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vehicle" }

  /vehicles/{vehicleId}:
    get:
      operationId: getVehicle
      tags: [vehicles]
      parameters:
        - { name: vehicleId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vehicle" }
    patch:
      operationId: updateVehicle
      tags: [vehicles]
      parameters:
        - { name: vehicleId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateVehicleInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vehicle" }
    delete:
      operationId: deleteVehicle
      tags: [vehicles]
      parameters:
        - { name: vehicleId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }

  /vehicles/{vehicleId}/history:
    get:
      operationId: getVehicleHistory
      tags: [vehicles]
      summary: Full service history timeline for a vehicle
      parameters:
        - { name: vehicleId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ServiceRecord" }

  /vehicles/{vehicleId}/reminders:
    get:
      operationId: getVehicleReminders
      tags: [vehicles]
      summary: Smart maintenance reminders for a vehicle
      parameters:
        - { name: vehicleId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MaintenanceReminder" }

  /service-centers:
    get:
      operationId: listServiceCenters
      tags: [serviceCenters]
      summary: Browse service centers
      parameters:
        - { name: specialty, in: query, required: false, schema: { type: string } }
        - { name: includeInactive, in: query, required: false, schema: { type: boolean } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ServiceCenter" }

  /service-centers/{centerId}:
    get:
      operationId: getServiceCenter
      tags: [serviceCenters]
      parameters:
        - { name: centerId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceCenter" }
    patch:
      operationId: updateServiceCenter
      tags: [serviceCenters]
      summary: Admin — suspend or reactivate a service center
      parameters:
        - { name: centerId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateActiveInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceCenter" }
    delete:
      operationId: deleteServiceCenter
      tags: [serviceCenters]
      summary: Admin — permanently delete a service center (only if it has no bookings)
      parameters:
        - { name: centerId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "409":
          description: Conflict — center has dependent records, suspend instead
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteConflict" }

  /mechanics:
    get:
      operationId: listMechanics
      tags: [mechanics]
      summary: List every mechanic across all service centers (used by admins)
      parameters:
        - { name: includeInactive, in: query, required: false, schema: { type: boolean } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Mechanic" }

  /service-centers/{centerId}/mechanics:
    get:
      operationId: listMechanicsForCenter
      tags: [mechanics]
      parameters:
        - { name: centerId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Mechanic" }

  /mechanics/{mechanicId}:
    get:
      operationId: getMechanic
      tags: [mechanics]
      parameters:
        - { name: mechanicId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mechanic" }
    patch:
      operationId: updateMechanic
      tags: [mechanics]
      summary: Admin — suspend or reactivate a mechanic
      parameters:
        - { name: mechanicId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateActiveInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mechanic" }
    delete:
      operationId: deleteMechanic
      tags: [mechanics]
      summary: Admin — permanently delete a mechanic (only if not assigned to any booking)
      parameters:
        - { name: mechanicId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "409":
          description: Conflict — mechanic has dependent records, suspend instead
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteConflict" }

  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List bookings for the active role
      parameters:
        - name: role
          in: query
          required: false
          schema: { type: string, enum: [owner, center] }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [requested, accepted, in_progress, awaiting_approval, approved, completed, cancelled] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Booking" }
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Owner books a service
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBookingInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }

  /bookings/{bookingId}:
    get:
      operationId: getBooking
      tags: [bookings]
      parameters:
        - { name: bookingId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingDetail" }

  /bookings/{bookingId}/status:
    patch:
      operationId: updateBookingStatus
      tags: [bookings]
      summary: Move a booking through its lifecycle
      parameters:
        - { name: bookingId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateBookingStatusInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }

  /bookings/{bookingId}/assign-mechanic:
    post:
      operationId: assignMechanic
      tags: [bookings]
      summary: Service center assigns a mechanic to a booking
      parameters:
        - { name: bookingId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignMechanicInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }

  /bookings/{bookingId}/invoice:
    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Service center creates an invoice for a booking
      parameters:
        - { name: bookingId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvoiceInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }

  /invoices/{invoiceId}:
    get:
      operationId: getInvoice
      tags: [invoices]
      parameters:
        - { name: invoiceId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }

  /invoices/{invoiceId}/approve:
    post:
      operationId: approveInvoice
      tags: [invoices]
      summary: Owner approves a pending invoice
      parameters:
        - { name: invoiceId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }

  /invoices/{invoiceId}/pay:
    post:
      operationId: payInvoice
      tags: [invoices]
      summary: Mark an approved invoice as paid (mocked payment)
      parameters:
        - { name: invoiceId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }

  /dashboard/owner:
    get:
      operationId: getOwnerDashboard
      tags: [dashboard]
      summary: Headline numbers for the vehicle owner
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerDashboard" }

  /dashboard/center:
    get:
      operationId: getCenterDashboard
      tags: [dashboard]
      summary: Headline numbers for the service center
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CenterDashboard" }

  /activity:
    get:
      operationId: listActivity
      tags: [dashboard]
      summary: Recent activity feed across the platform
      parameters:
        - name: role
          in: query
          required: false
          schema: { type: string, enum: [owner, center] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityEvent" }

  /vendors:
    get:
      operationId: listVendors
      tags: [vendors]
      summary: List all vendors, optionally sorted by proximity (same city first, then same region, then everywhere)
      parameters:
        - { name: nearCity, in: query, required: false, schema: { type: string } }
        - { name: nearRegion, in: query, required: false, schema: { type: string } }
        - { name: includeInactive, in: query, required: false, schema: { type: boolean } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Vendor" }

  /vendors/{vendorId}:
    get:
      operationId: getVendor
      tags: [vendors]
      summary: Get a vendor
      parameters:
        - { name: vendorId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vendor" }
    patch:
      operationId: updateVendor
      tags: [vendors]
      summary: Admin — suspend or reactivate a vendor
      parameters:
        - { name: vendorId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateActiveInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vendor" }
    delete:
      operationId: deleteVendor
      tags: [vendors]
      summary: Admin — permanently delete a vendor (only if it has no orders or parts)
      parameters:
        - { name: vendorId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "409":
          description: Conflict — vendor has dependent records, suspend instead
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteConflict" }

  /vendors/{vendorId}/parts:
    get:
      operationId: listPartsForVendor
      tags: [parts]
      summary: List parts for a vendor (includes inactive)
      parameters:
        - { name: vendorId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Part" }
    post:
      operationId: createPart
      tags: [parts]
      summary: Add a new part to a vendor's catalog
      parameters:
        - { name: vendorId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePartInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Part" }

  /parts:
    get:
      operationId: listParts
      tags: [parts]
      summary: Browse the marketplace catalog
      parameters:
        - { name: category, in: query, required: false, schema: { type: string } }
        - { name: brand, in: query, required: false, schema: { type: string } }
        - { name: search, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Part" }

  /parts/{partId}:
    get:
      operationId: getPart
      tags: [parts]
      summary: Get a part by id
      parameters:
        - { name: partId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Part" }
    patch:
      operationId: updatePart
      tags: [parts]
      summary: Update part details, price, stock, or active state
      parameters:
        - { name: partId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePartInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Part" }

  /catalog/part-categories:
    get:
      operationId: listPartCategories
      tags: [catalog]
      summary: Distinct part categories with counts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CategoryCount" }

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders, optionally scoped by vendor, buyer, booking, mechanic, delivery agent, or status
      parameters:
        - { name: vendorId, in: query, required: false, schema: { type: string } }
        - { name: buyerName, in: query, required: false, schema: { type: string } }
        - { name: bookingId, in: query, required: false, schema: { type: string } }
        - { name: mechanicId, in: query, required: false, schema: { type: string } }
        - { name: deliveryAgentId, in: query, required: false, schema: { type: string } }
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [proposed, placed, confirmed, shipped, delivered, cancelled]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place a new order (one vendor per order)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderDetail" }

  /orders/{orderId}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order with line items
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderDetail" }

  /orders/{orderId}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Advance the order through its fulfillment lifecycle
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrderStatusInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }

  /dashboard/vendor/{vendorId}:
    get:
      operationId: getVendorDashboard
      tags: [dashboard]
      summary: Headline numbers for a vendor
      parameters:
        - { name: vendorId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorDashboard" }

  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Platform-wide overview for the super admin / platform owner
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }

  /delivery-agents:
    get:
      operationId: listDeliveryAgents
      tags: [delivery]
      summary: List delivery agents, optionally filtered by city/region or active status
      parameters:
        - { name: city, in: query, required: false, schema: { type: string } }
        - { name: region, in: query, required: false, schema: { type: string } }
        - { name: activeOnly, in: query, required: false, schema: { type: boolean } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DeliveryAgent" }
    post:
      operationId: registerDeliveryAgent
      tags: [delivery]
      summary: Self-register as a delivery agent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterDeliveryAgentInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryAgent" }

  /delivery-agents/{agentId}:
    get:
      operationId: getDeliveryAgent
      tags: [delivery]
      summary: Get a delivery agent
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryAgent" }
    patch:
      operationId: updateDeliveryAgent
      tags: [delivery]
      summary: Update a delivery agent (admin can deactivate, agent can edit profile)
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDeliveryAgentInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryAgent" }
    delete:
      operationId: deleteDeliveryAgent
      tags: [delivery]
      summary: Admin — permanently delete a delivery agent (only if not on any order)
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "409":
          description: Conflict — agent has dependent records, suspend instead
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteConflict" }

  /platform-staff:
    get:
      operationId: listPlatformStaff
      tags: [platformStaff]
      summary: List platform staff (admins + custom-permission staff)
      parameters:
        - { name: includeInactive, in: query, required: false, schema: { type: boolean } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlatformStaff" }
    post:
      operationId: createPlatformStaff
      tags: [platformStaff]
      summary: Add a new platform staff member
      requestBody:
        required: true
        content:
          application/json:
