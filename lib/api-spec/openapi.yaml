    PublicRentalCar:
      type: object
      description: |
        Sanitized rental car view served at /rental-cars/{carId}/public for
        anonymous share-link visitors. Owner phone/email and plate number are
        intentionally omitted.
      required: [id, ownerKind, ownerName, brand, model, year, color, transmission, seats, fuelType, dailyRate, city, pickupAddress, rentalModes]
      properties:
        id: { type: string }
        ownerKind: { type: string, enum: [platform, user] }
        ownerName: { type: string }
        brand: { type: string }
        model: { type: string }
        year: { type: integer }
        color: { type: string }
        transmission: { type: string, enum: [automatic, manual] }
        seats: { type: integer }
        fuelType: { type: string, enum: [petrol, diesel, hybrid, electric] }
        dailyRate: { type: number }
        city: { type: string }
        pickupAddress: { type: string }
        description: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
        imageUrls:
          type: array
          items: { type: string }
        rentalModes:
          type: array
          items: { type: string, enum: [self_drive, with_driver] }
        withDriverDailyRate: { type: number, nullable: true }
        driver:
          allOf:
            - { $ref: "#/components/schemas/PublicDriver" }
          nullable: true

    PublicDriver:
      type: object
      description: |
        Sanitized driver view bundled into PublicRentalCar. Excludes the
