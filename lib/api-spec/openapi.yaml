components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    Vehicle:
      type: object
      required: [id, ownerName, brand, model, year, plateNumber, color, mileage, createdAt]
      properties:
        id: { type: string }
        ownerName: { type: string }
        ownerPhone: { type: string, nullable: true }
        brand: { type: string }
        model: { type: string }
        year: { type: integer }
        vin: { type: string, nullable: true }
        plateNumber: { type: string }
        color: { type: string }
        engineType: { type: string, nullable: true }
        mileage: { type: integer }
        imageUrl: { type: string, nullable: true }
        nextServiceDate: { type: string, format: date-time, nullable: true }
        insuranceProvider: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    CreateVehicleInput:
      type: object
      required: [ownerName, brand, model, year, plateNumber, color, mileage]
      properties:
        ownerName: { type: string, minLength: 1 }
        ownerPhone: { type: string, nullable: true }
        brand: { type: string, minLength: 1 }
        model: { type: string, minLength: 1 }
        year: { type: integer, minimum: 1900, maximum: 2100 }
        vin: { type: string, nullable: true }
        plateNumber: { type: string, minLength: 1 }
        color: { type: string, minLength: 1 }
        engineType: { type: string, nullable: true }
        mileage: { type: integer, minimum: 0 }
        imageUrl: { type: string, nullable: true }
        insuranceProvider: { type: string, nullable: true }

    UpdateVehicleInput:
      type: object
      properties:
        ownerName: { type: string }
        ownerPhone: { type: string, nullable: true }
        brand: { type: string }
        model: { type: string }
        year: { type: integer }
        vin: { type: string, nullable: true }
        plateNumber: { type: string }
        color: { type: string }
        engineType: { type: string, nullable: true }
        mileage: { type: integer }
        imageUrl: { type: string, nullable: true }
        insuranceProvider: { type: string, nullable: true }

    ServiceCenter:
      type: object
      required: [id, name, address, phone, specialties, rating, reviewsCount, openJobs]
      properties:
        id: { type: string }
        name: { type: string }
        address: { type: string }
        city: { type: string }
        region: { type: string }
        phone: { type: string }
        specialties:
          type: array
          items: { type: string }
        rating: { type: number }
        reviewsCount: { type: integer }
        openJobs: { type: integer }
        imageUrl: { type: string, nullable: true }
        bio: { type: string, nullable: true }
        active: { type: boolean }

    Mechanic:
      type: object
      required: [id, serviceCenterId, name, yearsExperience, specialization, rating, completedJobs]
      properties:
        id: { type: string }
        serviceCenterId: { type: string }
        name: { type: string }
        yearsExperience: { type: integer }
        specialization: { type: string }
        certifications:
          type: array
          items: { type: string }
        rating: { type: number }
        completedJobs: { type: integer }
        avatarUrl: { type: string, nullable: true }
        active: { type: boolean }

    Booking:
      type: object
      required: [id, vehicleId, serviceCenterId, serviceType, description, status, requestedAt]
      properties:
        id: { type: string }
        vehicleId: { type: string }
        serviceCenterId: { type: string }
        mechanicId: { type: string, nullable: true }
        serviceType: { type: string }
        description: { type: string }
        status:
          type: string
          enum: [requested, accepted, in_progress, awaiting_approval, approved, completed, cancelled]
        requestedAt: { type: string, format: date-time }
        scheduledAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        estimatedDurationHours: { type: number, nullable: true }
        vehicle: { $ref: "#/components/schemas/Vehicle" }
        serviceCenter: { $ref: "#/components/schemas/ServiceCenter" }
        mechanic:
          oneOf:
            - { $ref: "#/components/schemas/Mechanic" }
            - { type: "null" }
        invoiceId: { type: string, nullable: true }

    BookingDetail:
      allOf:
        - $ref: "#/components/schemas/Booking"
        - type: object
          properties:
            invoice:
              oneOf:
                - { $ref: "#/components/schemas/Invoice" }
                - { type: "null" }
            timeline:
              type: array
              items: { $ref: "#/components/schemas/TimelineEntry" }

    TimelineEntry:
      type: object
      required: [at, label]
      properties:
        at: { type: string, format: date-time }
        label: { type: string }
        actor: { type: string, nullable: true }

    CreateBookingInput:
      type: object
      required: [vehicleId, serviceCenterId, serviceType, description]
      properties:
        vehicleId: { type: string }
        serviceCenterId: { type: string }
        serviceType: { type: string }
        description: { type: string }
        scheduledAt: { type: string, format: date-time, nullable: true }

    UpdateBookingStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [requested, accepted, in_progress, awaiting_approval, approved, completed, cancelled]
        estimatedDurationHours: { type: number, nullable: true }
        scheduledAt: { type: string, format: date-time, nullable: true }

    AssignMechanicInput:
      type: object
      required: [mechanicId]
      properties:
        mechanicId: { type: string }

    InvoiceItem:
      type: object
      required: [description, quantity, unitPrice, kind]
      properties:
        description: { type: string }
        quantity: { type: number }
        unitPrice: { type: number }
        kind:
          type: string
          enum: [labor, part]

    Invoice:
      type: object
      required: [id, bookingId, items, laborTotal, partsTotal, tax, total, status, createdAt]
      properties:
        id: { type: string }
        bookingId: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/InvoiceItem" }
        laborTotal: { type: number }
        partsTotal: { type: number }
        tax: { type: number }
        total: { type: number }
        notes: { type: string, nullable: true }
        status:
          type: string
          enum: [pending_approval, approved, paid, rejected]
        createdAt: { type: string, format: date-time }
        approvedAt: { type: string, format: date-time, nullable: true }
        paidAt: { type: string, format: date-time, nullable: true }

    CreateInvoiceInput:
      type: object
      required: [items, taxRate]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/InvoiceItem" }
        taxRate: { type: number, minimum: 0, maximum: 1 }
        notes: { type: string, nullable: true }

    ServiceRecord:
      type: object
      required: [id, vehicleId, serviceType, summary, totalCost, completedAt, serviceCenterName]
      properties:
        id: { type: string }
        vehicleId: { type: string }
        serviceType: { type: string }
        summary: { type: string }
        totalCost: { type: number }
        completedAt: { type: string, format: date-time }
        serviceCenterName: { type: string }
        mechanicName: { type: string, nullable: true }
        mileageAtService: { type: integer, nullable: true }

    MaintenanceReminder:
      type: object
      required: [id, vehicleId, title, dueAt, urgency]
      properties:
        id: { type: string }
        vehicleId: { type: string }
        title: { type: string }
        detail: { type: string, nullable: true }
        dueAt: { type: string, format: date-time }
        urgency:
          type: string
          enum: [low, medium, high]

    OwnerDashboard:
      type: object
      required: [vehiclesCount, activeBookings, pendingApprovals, lifetimeSpend, upcomingReminders, statusBreakdown]
      properties:
        vehiclesCount: { type: integer }
        activeBookings: { type: integer }
        pendingApprovals: { type: integer }
        lifetimeSpend: { type: number }
        upcomingReminders:
          type: array
          items: { $ref: "#/components/schemas/MaintenanceReminder" }
        statusBreakdown:
          type: array
          items: { $ref: "#/components/schemas/StatusCount" }

    CenterDashboard:
      type: object
      required: [pendingRequests, jobsInProgress, completedToday, revenueThisMonth, topMechanics, statusBreakdown]
      properties:
        pendingRequests: { type: integer }
        jobsInProgress: { type: integer }
        completedToday: { type: integer }
        revenueThisMonth: { type: number }
        topMechanics:
          type: array
          items: { $ref: "#/components/schemas/Mechanic" }
        statusBreakdown:
          type: array
          items: { $ref: "#/components/schemas/StatusCount" }

    StatusCount:
      type: object
      required: [status, count]
      properties:
        status: { type: string }
        count: { type: integer }

    ActivityEvent:
      type: object
      required: [id, at, kind, message]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        kind:
          type: string
          enum: [booking_created, booking_accepted, mechanic_assigned, invoice_created, invoice_approved, invoice_paid, booking_completed]
        message: { type: string }
        bookingId: { type: string, nullable: true }
        vehicleId: { type: string, nullable: true }

    ServiceType:
      type: object
      required: [id, name, description, estimatedHours, startingPrice]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        estimatedHours: { type: number }
        startingPrice: { type: number }
        icon: { type: string, nullable: true }

    Vendor:
      type: object
      required: [id, name, address, city, region, phone, rating, reviewsCount, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        bio: { type: string, nullable: true }
        address: { type: string }
        city: { type: string }
        region: { type: string }
        phone: { type: string }
        rating: { type: number }
        reviewsCount: { type: integer }
        logoUrl: { type: string, nullable: true }
        partsCount: { type: integer }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }

    Part:
      type: object
      required: [id, vendorId, name, description, category, brand, sku, price, stock, compatibleBrands, active, createdAt]
      properties:
        id: { type: string }
        vendorId: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        brand: { type: string }
        sku: { type: string }
        price: { type: number }
        stock: { type: integer }
        imageUrl: { type: string, nullable: true }
        compatibleBrands:
          type: array
          items: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        vendor:
          oneOf:
            - { $ref: "#/components/schemas/Vendor" }
            - { type: "null" }

    CreatePartInput:
      type: object
      required: [name, description, category, brand, sku, price, stock]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        brand: { type: string, minLength: 1 }
        sku: { type: string, minLength: 1 }
        price: { type: number, minimum: 0 }
        stock: { type: integer, minimum: 0 }
        imageUrl: { type: string, nullable: true }
        compatibleBrands:
          type: array
          items: { type: string }

    UpdatePartInput:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        category: { type: string }
        brand: { type: string }
        sku: { type: string }
        price: { type: number, minimum: 0 }
        stock: { type: integer, minimum: 0 }
        imageUrl: { type: string, nullable: true }
        compatibleBrands:
          type: array
          items: { type: string }
        active: { type: boolean }

    CategoryCount:
      type: object
      required: [category, count]
      properties:
        category: { type: string }
        count: { type: integer }

    Order:
      type: object
      required: [id, vendorId, buyerKind, buyerName, buyerPhone, shippingAddress, status, itemsTotal, shippingFee, total, placedAt]
      properties:
        id: { type: string }
        vendorId: { type: string }
        bookingId: { type: string, nullable: true }
        mechanicId: { type: string, nullable: true }
        deliveryAgentId: { type: string, nullable: true }
        buyerKind:
          type: string
          enum: [owner, center]
        buyerName: { type: string }
        buyerPhone: { type: string }
        shippingAddress: { type: string }
        deliveryCity: { type: string }
        deliveryRegion: { type: string }
        notes: { type: string, nullable: true }
        status:
          type: string
          enum: [proposed, placed, confirmed, shipped, delivered, cancelled]
        itemsTotal: { type: number }
        shippingFee: { type: number }
        total: { type: number }
        proposedAt: { type: string, format: date-time, nullable: true }
        placedAt: { type: string, format: date-time }
        approvedAt: { type: string, format: date-time, nullable: true }
        rejectedAt: { type: string, format: date-time, nullable: true }
        confirmedAt: { type: string, format: date-time, nullable: true }
        shippedAt: { type: string, format: date-time, nullable: true }
        deliveredAt: { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
        trackingCode: { type: string, nullable: true }
        itemsCount: { type: integer }
        vendor:
          oneOf:
            - { $ref: "#/components/schemas/Vendor" }
            - { type: "null" }
        mechanic:
          oneOf:
            - { $ref: "#/components/schemas/Mechanic" }
            - { type: "null" }
        deliveryAgent:
          oneOf:
            - { $ref: "#/components/schemas/DeliveryAgent" }
            - { type: "null" }
        bookingSummary:
          oneOf:
            - { $ref: "#/components/schemas/OrderBookingSummary" }
            - { type: "null" }

    OrderBookingSummary:
      type: object
      required: [id, serviceType, status, vehicleLabel]
      properties:
        id: { type: string }
        serviceType: { type: string }
        status: { type: string }
        vehicleLabel: { type: string }

    OrderLine:
      type: object
      required: [id, orderId, partId, quantity, unitPrice, lineTotal, snapshot]
      properties:
        id: { type: string }
        orderId: { type: string }
        partId: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number }
        lineTotal: { type: number }
        snapshot:
          type: object
          required: [partId, name, sku, unitPrice, quantity]
          properties:
            partId: { type: string }
            name: { type: string }
            sku: { type: string }
            unitPrice: { type: number }
            quantity: { type: integer }
            imageUrl: { type: string, nullable: true }

    OrderDetail:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/OrderLine" }

    CreateOrderItemInput:
      type: object
      required: [partId, quantity]
      properties:
        partId: { type: string }
        quantity: { type: integer, minimum: 1 }

    CreateOrderInput:
      type: object
      required: [vendorId, buyerKind, buyerName, buyerPhone, shippingAddress, items]
      properties:
        vendorId: { type: string }
        # If bookingId + mechanicId are provided, the order is created in the "proposed" state
        # and goes to the car owner for approval before being placed and stock-reserved.
        bookingId: { type: string, nullable: true }
        mechanicId: { type: string, nullable: true }
        buyerKind:
          type: string
          enum: [owner, center]
        buyerName: { type: string, minLength: 1 }
        buyerPhone: { type: string, minLength: 1 }
        shippingAddress: { type: string, minLength: 1 }
        deliveryCity: { type: string, nullable: true }
        deliveryRegion: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/CreateOrderItemInput" }

    UpdateOrderStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [placed, confirmed, shipped, delivered, cancelled]
        trackingCode: { type: string, nullable: true }
        # Required when transitioning confirmed → shipped
        deliveryAgentId: { type: string, nullable: true }

    DeliveryAgent:
      type: object
      required: [id, name, phone, city, region, vehicleType, rating, completedDeliveries, active, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        phone: { type: string }
        city: { type: string }
        region: { type: string }
        vehicleType: { type: string }
        bio: { type: string, nullable: true }
        rating: { type: number }
        completedDeliveries: { type: integer }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }

    UpdateActiveInput:
      type: object
      required: [active]
      properties:
        active: { type: boolean }

    DeleteConflict:
      type: object
      required: [error, reason]
      properties:
        error: { type: string }
        reason: { type: string, enum: [has_dependents] }
        details: { type: string }

    UpdateDeliveryAgentInput:
      type: object
      properties:
        active: { type: boolean }
        bio: { type: string, nullable: true }
        vehicleType: { type: string }

    AdminCounts:
      type: object
      required: [vehicles, serviceCenters, mechanics, vendors, parts, deliveryAgents, bookings, orders, invoices]
      properties:
        vehicles: { type: integer }
        serviceCenters: { type: integer }
        mechanics: { type: integer }
        vendors: { type: integer }
        parts: { type: integer }
        deliveryAgents: { type: integer }
        activeDeliveryAgents: { type: integer }
        bookings: { type: integer }
        orders: { type: integer }
        invoices: { type: integer }

    AdminOverview:
      type: object
      required: [counts, revenue, bookingStatusBreakdown, orderStatusBreakdown, recentBookings, recentOrders]
      properties:
        counts: { $ref: "#/components/schemas/AdminCounts" }
        revenue:
          type: object
          required: [invoicesPaid, ordersPlaced]
          properties:
            invoicesPaid: { type: number }
            ordersPlaced: { type: number }
        bookingStatusBreakdown:
          type: array
          items: { $ref: "#/components/schemas/StatusCount" }
        orderStatusBreakdown:
          type: array
          items: { $ref: "#/components/schemas/StatusCount" }
        recentBookings:
          type: array
          items: { $ref: "#/components/schemas/Booking" }
        recentOrders:
          type: array
          items: { $ref: "#/components/schemas/Order" }

    RegisterDeliveryAgentInput:
      type: object
      required: [name, phone, city, region, vehicleType]
      properties:
        name: { type: string, minLength: 1 }
        phone: { type: string, minLength: 1 }
        city: { type: string, minLength: 1 }
        region: { type: string, minLength: 1 }
        vehicleType: { type: string, minLength: 1 }
        bio: { type: string, nullable: true }

    VendorDashboard:
      type: object
      required: [vendorId, partsCount, lowStockCount, openOrders, revenueThisMonth, statusBreakdown]
      properties:
        vendorId: { type: string }
        partsCount: { type: integer }
        lowStockCount: { type: integer }
        openOrders: { type: integer }
        revenueThisMonth: { type: number }
        statusBreakdown:
          type: array
          items: { $ref: "#/components/schemas/StatusCount" }

    PlatformStaff:
      type: object
      required: [id, name, email, role, permissions, active, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [admin, staff] }
        permissions:
          type: array
          items: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }

    CreatePlatformStaffInput:
      type: object
      required: [name, email]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, staff] }
        permissions:
          type: array
          items: { type: string }

    UpdatePlatformStaffInput:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, staff] }
        permissions:
          type: array
          items: { type: string }
        active: { type: boolean }

    SubscriptionPlan:
      type: object
      required: [id, name, audience, priceMonthly, features, active, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        audience: { type: string, enum: [center, vendor, owner] }
        priceMonthly: { type: number }
        features:
          type: array
          items: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }

    CreateSubscriptionPlanInput:
      type: object
      required: [name, audience, priceMonthly]
      properties:
        name: { type: string, minLength: 1 }
        audience: { type: string, enum: [center, vendor, owner] }
        priceMonthly: { type: number, minimum: 0 }
        features:
          type: array
          items: { type: string }

    UpdateSubscriptionPlanInput:
      type: object
      properties:
        name: { type: string }
        priceMonthly: { type: number, minimum: 0 }
        features:
          type: array
          items: { type: string }
        active: { type: boolean }

    Subscription:
      type: object
      required:
        [id, subscriberKind, subscriberId, subscriberName, status, startedAt, currentPeriodEnd, createdAt]
      properties:
        id: { type: string }
        subscriberKind: { type: string, enum: [center, vendor, owner] }
        subscriberId: { type: string }
        subscriberName: { type: string }
        planId: { type: string, nullable: true }
        planName: { type: string, nullable: true }
        priceMonthly: { type: number, nullable: true }
        status: { type: string, enum: [active, cancelled, past_due] }
        startedAt: { type: string, format: date-time }
        currentPeriodEnd: { type: string, format: date-time }
        cancelledAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    CreateSubscriptionInput:
      type: object
      required: [subscriberKind, subscriberId, subscriberName, planId]
      properties:
        subscriberKind: { type: string, enum: [center, vendor, owner] }
        subscriberId: { type: string, minLength: 1 }
        subscriberName: { type: string, minLength: 1 }
        planId: { type: string }

    UpdateSubscriptionInput:
      type: object
      properties:
        planId: { type: string }
        status: { type: string, enum: [active, cancelled, past_due] }

    RevenueOverview:
      type: object
      required: [mrr, activeSubscriptions, commissionRate, totals, monthly, recentPayments]
      properties:
        mrr: { type: number }
        activeSubscriptions: { type: integer }
        commissionRate: { type: number }
        totals:
          type: object
          required: [subscriptions, bookingCommissions, orderCommissions, total]
          properties:
            subscriptions: { type: number }
            bookingCommissions: { type: number }
            orderCommissions: { type: number }
            total: { type: number }
        monthly:
          type: array
          items: { $ref: "#/components/schemas/RevenueMonth" }
        recentPayments:
          type: array
          items: { $ref: "#/components/schemas/RecentPayment" }

    RevenueMonth:
      type: object
      required: [month, subscriptions, bookingCommissions, orderCommissions]
      properties:
        month: { type: string }
        subscriptions: { type: number }
        bookingCommissions: { type: number }
        orderCommissions: { type: number }

    RecentPayment:
      type: object
      required: [id, kind, label, amount, paidAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [subscription, booking_commission, order_commission] }
        label: { type: string }
        amount: { type: number }
        paidAt: { type: string, format: date-time }

    RentalCar:
      type: object
      required: [id, ownerKind, ownerName, ownerPhone, brand, model, year, color, plateNumber, transmission, seats, fuelType, dailyRate, city, pickupAddress, status, active, createdAt]
      properties:
        id: { type: string }
        ownerKind: { type: string, enum: [platform, user] }
        ownerName: { type: string }
        ownerPhone: { type: string }
        ownerEmail: { type: string, nullable: true }
        brand: { type: string }
        model: { type: string }
        year: { type: integer }
        color: { type: string }
        plateNumber: { type: string }
        transmission: { type: string, enum: [automatic, manual] }
        seats: { type: integer }
        fuelType: { type: string, enum: [petrol, diesel, hybrid, electric] }
        dailyRate: { type: number }
        city: { type: string }
        pickupAddress: { type: string }
        description: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
        status: { type: string, enum: [pending, approved, unavailable] }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }

    CreateRentalCarInput:
      type: object
      required: [ownerKind, ownerName, ownerPhone, brand, model, year, color, plateNumber, transmission, seats, fuelType, dailyRate, city, pickupAddress]
      properties:
        ownerKind: { type: string, enum: [platform, user] }
        ownerName: { type: string, minLength: 1 }
        ownerPhone: { type: string, minLength: 1 }
        ownerEmail: { type: string }
        brand: { type: string, minLength: 1 }
        model: { type: string, minLength: 1 }
        year: { type: integer, minimum: 1990 }
        color: { type: string, minLength: 1 }
        plateNumber: { type: string, minLength: 1 }
        transmission: { type: string, enum: [automatic, manual] }
        seats: { type: integer, minimum: 2, maximum: 12 }
        fuelType: { type: string, enum: [petrol, diesel, hybrid, electric] }
        dailyRate: { type: number, minimum: 0 }
        city: { type: string, minLength: 1 }
        pickupAddress: { type: string, minLength: 1 }
        description: { type: string }
        imageUrl: { type: string }

    UpdateRentalCarInput:
      type: object
      properties:
        status: { type: string, enum: [pending, approved, unavailable] }
        active: { type: boolean }
        dailyRate: { type: number, minimum: 0 }
        description: { type: string }
        pickupAddress: { type: string }
        imageUrl: { type: string }

    RentalBooking:
      type: object
      required: [id, carId, renterName, renterPhone, startDate, endDate, days, dailyRate, total, status, purpose, ownerReviewStatus, paymentStatus, createdAt]
      properties:
        id: { type: string }
        carId: { type: string }
        carLabel: { type: string }
        carImageUrl: { type: string, nullable: true }
        carCity: { type: string, nullable: true }
        ownerName: { type: string, nullable: true }
        ownerPhone: { type: string, nullable: true }
        renterId: { type: string, nullable: true }
        renterName: { type: string }
        renterPhone: { type: string }
        renterEmail: { type: string, nullable: true }
        renter: { $ref: "#/components/schemas/RenterProfile", nullable: true }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        days: { type: integer }
        dailyRate: { type: number }
        total: { type: number }
        status:
          type: string
          enum:
            [
              pending_review,
              rejected,
              contract_pending,
              awaiting_payment,
              confirmed,
              active,
              completed,
              cancelled,
            ]
        purpose: { type: string, enum: [general, loaner] }
        serviceBookingId: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        ownerReviewStatus: { type: string, enum: [pending, approved, rejected] }
        ownerReviewNotes: { type: string, nullable: true }
        ownerReviewedAt: { type: string, format: date-time, nullable: true }
        contractText: { type: string, nullable: true }
        contractGeneratedAt: { type: string, format: date-time, nullable: true }
        renterSignatureName: { type: string, nullable: true }
        renterSignedAt: { type: string, format: date-time, nullable: true }
        ownerSignatureName: { type: string, nullable: true }
        ownerSignedAt: { type: string, format: date-time, nullable: true }
        paymentMethod: { type: string, enum: [online, cash_on_pickup], nullable: true }
        paymentStatus: { type: string, enum: [unpaid, paid] }
        paidAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        confirmedAt: { type: string, format: date-time, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
        rejectedAt: { type: string, format: date-time, nullable: true }

    CreateRentalBookingInput:
      type: object
      required: [carId, renterId, startDate, endDate]
      properties:
        carId: { type: string }
        renterId: { type: string }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        purpose: { type: string, enum: [general, loaner] }
        serviceBookingId: { type: string }
        notes: { type: string }

    UpdateRentalBookingInput:
      type: object
      description: >
        Drive booking lifecycle. Provide exactly one action group per request
        (ownerReview / sign / payment / status / notes).
      properties:
        status: { type: string, enum: [cancelled, active, completed] }
        notes: { type: string }
        ownerReview:
          type: object
          required: [decision]
          properties:
            decision: { type: string, enum: [approve, reject] }
            notes: { type: string }
        sign:
          type: object
          required: [party, name]
          properties:
            party: { type: string, enum: [renter, owner] }
            name: { type: string, minLength: 1 }
        payment:
          type: object
          required: [method]
          properties:
            method: { type: string, enum: [online, cash_on_pickup] }
            markPaid: { type: boolean }

    RenterProfile:
      type: object
      required: [id, name, phone, kycStatus, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        phone: { type: string }
        email: { type: string, nullable: true }
        address: { type: string, nullable: true }
        dateOfBirth: { type: string, nullable: true }
        driverLicenseNumber: { type: string, nullable: true }
        driverLicenseUrl: { type: string, nullable: true }
        idDocumentType: { type: string, nullable: true }
        idDocumentUrl: { type: string, nullable: true }
        selfieUrl: { type: string, nullable: true }
        kycStatus: { type: string, enum: [pending, verified, rejected] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UpsertRenterProfileInput:
      type: object
      required: [name, phone]
      properties:
        name: { type: string, minLength: 1 }
        phone: { type: string, minLength: 1 }
        email: { type: string }
        address: { type: string }
        dateOfBirth: { type: string }
        driverLicenseNumber: { type: string }
        driverLicenseUrl: { type: string }
        idDocumentType: { type: string }
        idDocumentUrl: { type: string }
        selfieUrl: { type: string }

    UpdateRenterProfileInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string }
        address: { type: string }
        dateOfBirth: { type: string }
        driverLicenseNumber: { type: string }
        driverLicenseUrl: { type: string }
        idDocumentType: { type: string }
        idDocumentUrl: { type: string }
        selfieUrl: { type: string }
        # Note: kycStatus intentionally omitted — it is set by AutoCare staff,
        # never by the renter themselves.

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 1 }
        contentType: { type: string, minLength: 1 }
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
        metadata: { $ref: '#/components/schemas/UploadUrlRequest' }
    StorageError:
      type: object
      required: [error]
      properties:
        error: { type: string }
