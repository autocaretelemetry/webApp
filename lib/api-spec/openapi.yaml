      summary: Update center self-service settings (WhatsApp notifications, etc.)
      parameters:
        - { name: centerId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateServiceCenterSettingsInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceCenter" }

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      parameters:
        - { name: ownerPhone, in: query, required: false, schema: { type: string } }
        - { name: unreadOnly, in: query, required: false, schema: { type: boolean } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }

  /notifications/{notificationId}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      parameters:
        - { name: notificationId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }

  /notifications/mark-all-read:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarkAllNotificationsReadInput" }
      responses:
        "204": { description: Marked }

  /notifications/generate-reminders:
    post:
      operationId: generateReminderNotifications
      tags: [notifications]
      summary: Run the service-reminder generator on demand
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateReminderNotificationsInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [created]
                properties:
                  created: { type: integer }

  /push/vapid-public-key:
    get:
      operationId: getVapidPublicKey
      tags: [push]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [publicKey]
                properties:
                  publicKey: { type: string }
        "503":
          description: Push not configured
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }

  /push/subscriptions:
    post:
      operationId: createPushSubscription
      tags: [push]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePushSubscriptionInput" }
      responses:
        "201":
          description: Subscribed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushSubscription" }
    delete:
      operationId: deletePushSubscription
      tags: [push]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeletePushSubscriptionInput" }
      responses:
        "204": { description: Unsubscribed }

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthedUser" }
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create a new owner/renter account and sign in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupInput" }
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthedUser" }
        "409":
          description: Email already in use
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /auth/signup/verify:
    post:
      operationId: verifySignupCode
      tags: [auth]
      summary: Verify the one-time code we sent to a signup contact channel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifySignupCodeInput" }
      responses:
        "200":
          description: Channel verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignupVerificationStatus" }
        "400":
          description: Invalid or expired code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: User not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /auth/signup/resend-verification:
    post:
      operationId: resendSignupVerification
      tags: [auth]
      summary: Resend the one-time code for a signup contact channel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResendSignupVerificationInput" }
      responses:
        "200":
          description: Code resent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignupVerificationStatus" }
        "400":
          description: Channel not pending verification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: User not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: Resend cooldown not elapsed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "204": { description: Logged out }
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthedUser" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    patch:
      operationId: updateMyProfile
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileInput" }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthedUser" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Email already in use
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /me/kyc:
    post:
      operationId: submitKyc
      tags: [onboarding]
      summary: Submit role-specific KYC documents for review
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KycSubmissionInput" }
      responses:
        "200":
          description: KYC submitted (status flipped to "submitted")
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthedUser" }
        "400":
          description: Invalid submission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Account is not approved yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/approvals:
    get:
      operationId: listApprovals
      tags: [onboarding]
      summary: Super-admin queue of self-signup applications
      parameters:
        - in: query
          name: state
          required: false
          schema:
            type: string
            enum: [pending, kyc_pending, rejected, all]
            default: pending
        - in: query
          name: role
          required: false
          schema:
            type: string
            enum: [owner, center, vendor, delivery, fleet, renter]
        - in: query
          name: q
          required: false
          schema: { type: string }
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum: [newest, oldest, role]
            default: newest
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: cursor
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Page of applicants
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AuthedUser" }
                  nextCursor:
                    type: string
                    nullable: true
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden (not super admin)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/approvals/{userId}:
    patch:
      operationId: decideApproval
      tags: [onboarding]
      summary: Approve or reject a pending application
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalDecisionInput" }
      responses:
        "200":
          description: Decision applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthedUser" }
        "404":
          description: Applicant not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Application is not pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/kyc/{userId}:
    patch:
      operationId: decideKyc
      tags: [onboarding]
      summary: Verify or reject a submitted KYC bundle
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KycDecisionInput" }
      responses:
        "200":
          description: Decision applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthedUser" }
        "404":
          description: Applicant not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: No KYC submission to review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordInput" }
      responses:
        "204": { description: Password changed }
        "400":
          description: Invalid input or current password incorrect
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

components:
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }

    SignupInput:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        phone: { type: string, nullable: true }
        requestedRole:
          type: string
          nullable: true
          enum: [owner, renter, center, vendor, delivery, fleet]
        applicantData:
          type: object
          additionalProperties: true
          nullable: true
        notificationChannels:
          type: array
          items: { type: string, enum: [email, whatsapp] }

    AuthedUser:
      type: object
      required: [id, email, name, role, active, createdAt]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role:
          type: string
          enum: [owner, renter, center, vendor, delivery, fleet, admin, super_admin]
        phone: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        approvalStatus:
          type: string
          nullable: true
          enum: [pending, approved, rejected]
        approvalNote: { type: string, nullable: true }
        kycStatus:
          type: string
          nullable: true
          enum: [not_submitted, submitted, verified, rejected]
        kycNote: { type: string, nullable: true }
        requestedRole: { type: string, nullable: true }
        notificationChannels:
          type: array
          items: { type: string, enum: [email, whatsapp] }
        emailVerifiedAt: { type: string, format: date-time, nullable: true }
        phoneVerifiedAt: { type: string, format: date-time, nullable: true }
        pendingVerificationChannels:
          type: array
          items: { type: string, enum: [email, whatsapp] }
        kycDocuments:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/KycDocument" }

    VerifySignupCodeInput:
      type: object
      required: [userId, channel, code]
      properties:
        userId: { type: string }
        channel: { type: string, enum: [email, whatsapp] }
        code: { type: string, minLength: 4, maxLength: 12 }

    ResendSignupVerificationInput:
      type: object
      required: [userId, channel]
      properties:
        userId: { type: string }
        channel: { type: string, enum: [email, whatsapp] }

    SignupVerificationStatus:
      type: object
      required: [userId, verifiedChannels, pendingChannels, allVerified]
      properties:
        userId: { type: string }
        verifiedChannels:
          type: array
          items: { type: string, enum: [email, whatsapp] }
        pendingChannels:
          type: array
          items: { type: string, enum: [email, whatsapp] }
        allVerified: { type: boolean }
        retryAfterSeconds: { type: integer, nullable: true }

    KycDocument:
      type: object
      required: [key, label, url]
      properties:
        key: { type: string }
        label: { type: string }
        url: { type: string }
        scanStatus:
          type: string
          enum: [pending, scanning, clean, infected, error]
        scanCheckedAt: { type: string, format: date-time }
        scanDetails: { type: string }
        rejectionReason: { type: string }
        rejectedAt: { type: string, format: date-time }

    KycSubmissionInput:
      type: object
      required: [documents]
      properties:
        documents:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/KycDocument" }

    ApprovalDecisionInput:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        note: { type: string, nullable: true }

    KycDecisionInput:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [verify, reject]
        note: { type: string, nullable: true }

    UpdateProfileInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        notificationChannels:
          type: array
          items: { type: string, enum: [email, whatsapp] }

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1 }
        newPassword: { type: string, minLength: 8 }

    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    Vehicle:
      type: object
      required: [id, ownerName, brand, model, year, plateNumber, color, mileage, serviceIntervalDays, serviceIntervalKm, createdAt]
      properties:
        id: { type: string }
        ownerName: { type: string }
        ownerPhone: { type: string, nullable: true }
        brand: { type: string }
        model: { type: string }
        year: { type: integer }
        vin: { type: string, nullable: true }
        plateNumber: { type: string }
        color: { type: string }
        engineType: { type: string, nullable: true }
        mileage: { type: integer }
        imageUrl: { type: string, nullable: true }
        nextServiceDate: { type: string, format: date-time, nullable: true }
        insuranceProvider: { type: string, nullable: true }
        serviceIntervalDays: { type: integer, minimum: 1 }
        serviceIntervalKm: { type: integer, minimum: 1 }
        lastServicedAt: { type: string, format: date-time, nullable: true }
        lastServicedMileage: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }

    CreateVehicleInput:
      type: object
      required: [ownerName, brand, model, year, plateNumber, color, mileage]
      properties:
        ownerName: { type: string, minLength: 1 }
        ownerPhone: { type: string, nullable: true }
        brand: { type: string, minLength: 1 }
        model: { type: string, minLength: 1 }
        year: { type: integer, minimum: 1900, maximum: 2100 }
        vin: { type: string, nullable: true }
        plateNumber: { type: string, minLength: 1 }
        color: { type: string, minLength: 1 }
        engineType: { type: string, nullable: true }
        mileage: { type: integer, minimum: 0 }
        imageUrl: { type: string, nullable: true }
        insuranceProvider: { type: string, nullable: true }
        serviceIntervalDays: { type: integer, minimum: 1 }
        serviceIntervalKm: { type: integer, minimum: 1 }

    UpdateVehicleInput:
      type: object
      properties:
        ownerName: { type: string }
        ownerPhone: { type: string, nullable: true }
        brand: { type: string }
        model: { type: string }
        year: { type: integer }
        vin: { type: string, nullable: true }
        plateNumber: { type: string }
        color: { type: string }
        engineType: { type: string, nullable: true }
        mileage: { type: integer }
        imageUrl: { type: string, nullable: true }
        insuranceProvider: { type: string, nullable: true }
        serviceIntervalDays: { type: integer, minimum: 1 }
        serviceIntervalKm: { type: integer, minimum: 1 }
        lastServicedAt: { type: string, format: date-time, nullable: true }
        lastServicedMileage: { type: integer, nullable: true }

    ServiceCenter:
      type: object
      required: [id, name, address, phone, specialties, rating, reviewsCount, openJobs]
      properties:
        id: { type: string }
        name: { type: string }
        address: { type: string }
        city: { type: string }
        region: { type: string }
        phone: { type: string }
        specialties:
          type: array
          items: { type: string }
        rating: { type: number }
        reviewsCount: { type: integer }
        openJobs: { type: integer }
        imageUrl: { type: string, nullable: true }
        bio: { type: string, nullable: true }
        active: { type: boolean }
        whatsappOptIn: { type: boolean }
        featured: { type: boolean, description: "Subscription-driven featured placement (sorted to top of directory)." }

    Mechanic:
      type: object
      required: [id, serviceCenterId, name, yearsExperience, specialization, rating, completedJobs]
      properties:
        id: { type: string }
        serviceCenterId: { type: string }
        name: { type: string }
        yearsExperience: { type: integer }
        specialization: { type: string }
        certifications:
          type: array
          items: { type: string }
        rating: { type: number }
        completedJobs: { type: integer }
        avatarUrl: { type: string, nullable: true }
        active: { type: boolean }

    LandingRoleCard:
      type: object
      required: [icon, title, desc]
      properties:
        icon:
          type: string
          enum: [car, building, package, truck, shield, wrench, users]
        title: { type: string }
        desc: { type: string }

    LandingContent:
      type: object
      required:
        - brandName
        - primaryColor
        - signInLabel
        - getStartedLabel
        - heroEyebrow
        - heroTitle
        - heroSubtitle
        - heroCtaLabel
        - rolesHeading
        - roles
        - featuresHeading
        - featuresSubtitle
        - features
        - footerText
        - footerSignInLabel
      properties:
        brandName: { type: string }
        logoUrl: { type: string, nullable: true }
        primaryColor: { type: string }
        signInLabel: { type: string }
        getStartedLabel: { type: string }
        heroEyebrow: { type: string }
        heroTitle: { type: string }
        heroSubtitle: { type: string }
        heroCtaLabel: { type: string }
        heroImageUrl: { type: string, nullable: true }
        rolesHeading: { type: string }
        roles:
          type: array
          items: { $ref: "#/components/schemas/LandingRoleCard" }
        featuresHeading: { type: string }
        featuresSubtitle: { type: string }
        features:
          type: array
          items: { type: string }
        footerText: { type: string }
        footerSignInLabel: { type: string }

    UpdateLandingContentInput:
      type: object
      properties:
        brandName: { type: string, minLength: 1 }
        logoUrl: { type: string, nullable: true }
        primaryColor: { type: string, minLength: 1 }
        signInLabel: { type: string, minLength: 1 }
        getStartedLabel: { type: string, minLength: 1 }
        heroEyebrow: { type: string, minLength: 1 }
        heroTitle: { type: string, minLength: 1 }
        heroSubtitle: { type: string, minLength: 1 }
        heroCtaLabel: { type: string, minLength: 1 }
        heroImageUrl: { type: string, nullable: true }
        rolesHeading: { type: string, minLength: 1 }
        roles:
          type: array
          items: { $ref: "#/components/schemas/LandingRoleCard" }
        featuresHeading: { type: string, minLength: 1 }
        featuresSubtitle: { type: string, minLength: 1 }
        features:
          type: array
          items: { type: string }
        footerText: { type: string, minLength: 1 }
        footerSignInLabel: { type: string, minLength: 1 }

    CreateMechanicInput:
      type: object
      required: [name, specialization]
      properties:
        name: { type: string, minLength: 1 }
        specialization: { type: string, minLength: 1 }
        yearsExperience: { type: integer, minimum: 0 }
        certifications:
          type: array
          items: { type: string }
        avatarUrl: { type: string, nullable: true }

    Booking:
      type: object
      required: [id, vehicleId, serviceCenterId, serviceType, description, status, requestedAt, priority]
      properties:
        id: { type: string }
        vehicleId: { type: string }
        serviceCenterId: { type: string }
        mechanicId: { type: string, nullable: true }
        serviceType: { type: string }
        description: { type: string }
        status:
          type: string
          enum: [requested, accepted, in_progress, awaiting_approval, approved, completed, cancelled]
        requestedAt: { type: string, format: date-time }
        scheduledAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        estimatedDurationHours: { type: number, nullable: true }
        priority: { type: boolean, description: "True when the owner's active subscription grants priorityBooking. The center queue surfaces priority bookings at the top." }
        vehicle: { $ref: "#/components/schemas/Vehicle" }
        serviceCenter: { $ref: "#/components/schemas/ServiceCenter" }
        mechanic:
          oneOf:
            - { $ref: "#/components/schemas/Mechanic" }
            - { type: "null" }
        invoiceId: { type: string, nullable: true }

    BookingDetail:
      allOf:
        - $ref: "#/components/schemas/Booking"
        - type: object
          properties:
            invoice:
              oneOf:
                - { $ref: "#/components/schemas/Invoice" }
                - { type: "null" }
            timeline:
              type: array
              items: { $ref: "#/components/schemas/TimelineEntry" }

    TimelineEntry:
      type: object
      required: [at, label]
      properties:
        at: { type: string, format: date-time }
        label: { type: string }
