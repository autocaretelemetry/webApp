kind = "mobile"
previewPath = "/mobile/"
title = "AutoCare Mobile"
version = "1.0.0"
id = "artifacts/autocare-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 20986

[services.development]
run = "pnpm --filter @workspace/autocare-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/autocare-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/autocare-mobile", "run", "serve" ]

[services.env]
PORT = "20986"
BASE_PATH = "/mobile/"
